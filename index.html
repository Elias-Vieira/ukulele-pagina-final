<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />

  <title>Ukulele Para Iniciantes</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6S0HG2P4C0"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "G-6S0HG2P4C0");

    function isTikTokBrowser() {
      const ua = navigator.userAgent || "";

      return (
        /BytedanceWebView/i.test(ua) ||
        /musical_ly/i.test(ua) ||
        /TikTok/i.test(ua) ||
        /ByteDance/i.test(ua) ||
        /TikTokWebView/i.test(ua)
      );
    }

    function isYouTubeBrowser() {
      const ua = navigator.userAgent || "";
      return /YouTube/i.test(ua);
    }

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function saveUTMs() {
      [
        "utm_source",
        "utm_medium",
        "utm_campaign",
        "utm_content",
        "utm_term",
        "sck",
        "ttclid",
        "fbclid",
        "gclid"
      ].forEach(function (key) {
        const value = getParam(key);

        if (value) {
          localStorage.setItem(key, value);
        }
      });
    }

    function getTrackingData() {
      return {
        utm_source:
          getParam("utm_source") ||
          localStorage.getItem("utm_source") ||
          "",

        utm_medium:
          getParam("utm_medium") ||
          localStorage.getItem("utm_medium") ||
          "",

        utm_campaign:
          getParam("utm_campaign") ||
          localStorage.getItem("utm_campaign") ||
          "",

        utm_content:
          getParam("utm_content") ||
          localStorage.getItem("utm_content") ||
          "",

        utm_term:
          getParam("utm_term") ||
          localStorage.getItem("utm_term") ||
          "",

        sck:
          getParam("sck") ||
          localStorage.getItem("sck") ||
          "",

        ttclid:
          getParam("ttclid") ||
          localStorage.getItem("ttclid") ||
          "",

        fbclid:
          getParam("fbclid") ||
          localStorage.getItem("fbclid") ||
          "",

        gclid:
          getParam("gclid") ||
          localStorage.getItem("gclid") ||
          "",

        page_location: window.location.href,
        page_title: document.title
      };
    }

    function sendEventOnce(eventName, params) {
      const key = "ga4_" + eventName + "_" + window.location.href;

      if (sessionStorage.getItem(key)) {
        return;
      }

      sessionStorage.setItem(key, "true");
      gtag("event", eventName, params);
    }

    (function () {
      saveUTMs();

      const isTikTok = isTikTokBrowser();
      const isYouTube = isYouTubeBrowser();
      const data = getTrackingData();

      if (data.utm_source === "tiktok") {
        sendEventOnce("tiktok_page_view", {
          ...data,
          navegador_interno_tiktok: isTikTok ? "sim" : "nao"
        });
      }

      if (data.utm_source === "youtube") {
        sendEventOnce("youtube_page_view", {
          ...data,
          navegador_interno_youtube: isYouTube ? "sim" : "nao"
        });
      }

      if (isTikTok && data.utm_source === "tiktok") {
        localStorage.setItem("tutorial_source", "tutorialTikTok");
        localStorage.setItem("tutorial_step", "entrou_no_tutorial");

        sendEventOnce("tutorial_tiktok_view", {
          ...data,
          tutorial_source: "tutorialTikTok",
          tutorial_step: "entrou_no_tutorial"
        });
      }

      if (!isTikTok && data.utm_source === "tiktok") {
        localStorage.setItem("tutorial_source", "tutorialTikTok");
        localStorage.setItem("tutorial_step", "chegou_na_pagina_final");

        sendEventOnce("tutorial_to_browser_success", {
          ...data,
          tutorial_source: "tutorialTikTok",
          tutorial_step: "chegou_na_pagina_final"
        });
      }
    })();
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #promo-bar {
      width: 100%;
      background: #ff5a00;
      color: white;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 10px;
      line-height: 1.4;
      position: relative;
      z-index: 9999;
    }

    #countdown {
      font-weight: 800;
    }

    body.tiktok-browser #promo-bar {
      display: none !important;
      height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    body.tiktok-browser {
      margin: 0 !important;
      padding: 0 !important;
    }

    #root {
      margin: 0;
      padding: 0;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BiagXP0q.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Cdn2lLb-.css">
</head>

<body>
  <div id="root"></div>


  <script>
    (function () {
      const isTikTok = isTikTokBrowser();

      if (isTikTok) {
        document.body.classList.add("tiktok-browser");
        return;
      }

      const promoBar = document.createElement("div");
      promoBar.id = "promo-bar";
      promoBar.innerHTML =
        'ÚLTIMAS HORAS: Essa oferta encerra em <span id="countdown">23:59:59</span>';

      document.body.insertBefore(
        promoBar,
        document.getElementById("root")
      );

      startPersistentCountdown();
    })();

    function startPersistentCountdown() {
      const countdownEl = document.getElementById("countdown");
      if (!countdownEl) return;

      const storageKey = "promo_end_time";
      const now = new Date().getTime();

      let endTime = localStorage.getItem(storageKey);

      if (!endTime || now > parseInt(endTime)) {
        endTime = now + 24 * 60 * 60 * 1000;
        localStorage.setItem(storageKey, endTime);
      }

      function updateCountdown() {
        const currentTime = new Date().getTime();
        const distance = endTime - currentTime;

        if (distance <= 0) {
          const newEndTime = currentTime + 24 * 60 * 60 * 1000;
          localStorage.setItem(storageKey, newEndTime);
          endTime = newEndTime;
          return;
        }

        const hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );

        const minutes = Math.floor(
          (distance % (1000 * 60 * 60)) /
          (1000 * 60)
        );

        const seconds = Math.floor(
          (distance % (1000 * 60)) /
          1000
        );

        countdownEl.textContent =
          String(hours).padStart(2, "0") +
          ":" +
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0");
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    }
  </script>
</body>
</html>
